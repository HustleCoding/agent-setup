name: Check installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh hooks/style-reminder.sh
      - run: python3 -m unittest discover -s tests -v
